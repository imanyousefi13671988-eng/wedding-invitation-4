<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faezeh & Iman</title>

<link rel="stylesheet" href="style.css">

<style>
body{
margin:0;
font-family:tahoma;
background:#f8f3ef;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:90%;
max-width:420px;
background:white;
border-radius:25px;
padding:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

img{
width:100%;
border-radius:20px;
}

h1{
color:#b88a5a;
margin:20px 0 5px;
}

p{
color:#666;
}

button{
background:#c89d68;
color:white;
border:none;
padding:15px 30px;
border-radius:50px;
font-size:18px;
margin-top:20px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="card">

<img src="images/couple.jpg">

<h1>Faezeh ❤ Iman</h1>

<p>29 Shahrivar 1405</p>

<p>20:00 Until the stars fade</p>

<p>Royal Hall - Kordkuy</p>

<button>Opening Soon...</button>

</div>

</body>
</html>
